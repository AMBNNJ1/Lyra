<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lyra Voice Mode</title>
  <link rel="stylesheet" href="/voice.css" />
</head>
<body>
  <header class="voice-header">
    <button id="backBtn" type="button" class="voice-link">
      <span class="icon" aria-hidden="true">&larr;</span>
      <span class="label">Back to Chat</span>
    </button>
  </header>
  <main class="voice-main">
    <div class="voice-panel">
      <div class="voice-avatar" id="avatarRing">
        <video id="voiceVideo" class="voice-video" src="/assets/nova_video.mp4" autoplay muted loop playsinline preload="auto" aria-label="Lyra avatar video"></video>
      </div>
      <div class="voice-name">Lyra</div>
      <p class="voice-status" id="voiceStatus">Tap the button to speak</p>
      <button id="voiceMic" class="voice-action" type="button" aria-pressed="false">
        <span class="voice-action-label" id="micLabel">Tap to Speak</span>
      </button>
      <div class="voice-note" id="voiceNote"></div>
    </div>
  </main>
  <script>
  (() => {
    const ring = document.getElementById('avatarRing');
    const statusEl = document.getElementById('voiceStatus');
    const micBtn = document.getElementById('voiceMic');
    const backBtn = document.getElementById('backBtn');
    const noteEl = document.getElementById('voiceNote');
    const micLabel = document.getElementById('micLabel');
    const avatarVideo = document.getElementById('voiceVideo');
    if (!ring || !statusEl || !micBtn) {
      console.error('Voice mode UI missing required elements.');
      return;
    }

    let recognition = null;
    let listening = false;
    let awaitingReply = false;
    let currentAudio = null;
    let currentUrl = null;

    let introPrompted = false;

    function ensureAvatarVideoReady() {
      if (!avatarVideo) return;
      avatarVideo.addEventListener('error', () => {
        avatarVideo.dataset.state = 'idle';
        avatarVideo.loop = true;
        avatarVideo.src = '/assets/nova_video.mp4';
        avatarVideo.play().catch(() => {});
      });
      const playIdle = () => {
        avatarVideo.play().catch(() => {});
      };
      if (!avatarVideo.dataset.state) {
        avatarVideo.dataset.state = 'idle';
      }
      if (avatarVideo.readyState >= 2) playIdle();
      else avatarVideo.addEventListener('canplay', playIdle, { once: true });
    }

    function setAvatarTalking(on) {
      if (!avatarVideo) return;
      avatarVideo.dataset.state = 'idle';
      avatarVideo.loop = true;
      if (!avatarVideo.currentSrc.includes('nova_video.mp4')) {
        avatarVideo.src = '/assets/nova_video.mp4';
        avatarVideo.load();
      }
      try { avatarVideo.play().catch(() => {}); } catch {}
    }
    async function sendToAgent(text, opts) {
      const options = opts || {};
      const allowEmpty = !!options.allowEmpty;
      const message = (text || '').trim();
      if (!message && !allowEmpty) {
        setStatus('Try saying something.');
        return '';
      }
      if (awaitingReply) {
        setStatus('Hold on, Lyra is still replying.');
        return '';
      }
      const guestAllowed = canUseGuestQuota();
      if (!guestAllowed && !CLERK_LOGIN_DISABLED) {
        setStatus('Please sign in to keep talking with Lyra.');
        if (noteEl) noteEl.textContent = 'Open the chat to sign in and unlock unlimited voice conversations.';
        return '';
      }
      if (noteEl) {
        noteEl.textContent = '';
      }
      setStatus('Lyra is thinking...');
      awaitingReply = true;
      setAvatarTalking(false);
      let shouldConsumeGuest = Boolean(message) && guestAllowed;
      let guestOverrideCount = null;
      try {
        const headers = { 'Content-Type': 'application/json' };
        applyGuestHeaders(headers);
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers,
          body: JSON.stringify({ message })
        });
        if (resp.status === 401) {
          if (!CLERK_LOGIN_DISABLED) {
            setStatus('Please sign in to keep talking with Lyra.');
            if (noteEl) noteEl.textContent = 'Open the chat to sign in and unlock unlimited voice conversations.';
            micBtn.disabled = true;
            micBtn.classList.add('is-disabled');
          } else {
            setStatus('Voice mode is temporarily unavailable.');
            if (noteEl) noteEl.textContent = 'Server rejected the request without Clerk authentication.';
          }
          return '';
        }
        if (resp.status === 402) {
          if (!CLERK_LOGIN_DISABLED) {
            setStatus('Sign in to continue chatting.');
          } else {
            setStatus('Voice mode is temporarily unavailable.');
          }
          return '';
        }
        if (!resp.ok) {
          throw new Error('request_failed');
        }
        if (shouldConsumeGuest) {
          const remainingHeader = resp.headers.get('X-Guest-Remaining');
          if (remainingHeader !== null) {
            const remainingNum = Number(remainingHeader);
            if (!Number.isNaN(remainingNum)) {
              guestOverrideCount = Math.min(GUEST_LIMIT, Math.max(0, Math.round(GUEST_LIMIT - remainingNum)));
            }
          }
        }
        const data = await resp.json();
        const reply = (data && data.reply) || '';
        if (reply) {
          setStatus('Lyra is speaking...');
          await speakText(reply);
          setStatus('Tap the button to speak again');
        } else {
          setStatus('Lyra is ready to listen.');
          setAvatarTalking(false);
        }
        return reply;
      } catch (err) {
        console.error('sendToAgent error', err);
        setStatus('Something went wrong. Please try again.');
        if (noteEl) {
          noteEl.textContent = 'Network error - try again in a moment.';
        }
        return '';
      } finally {
        awaitingReply = false;
        if (!currentAudio) setAvatarTalking(false);
        if (shouldConsumeGuest) consumeGuestQuota(guestOverrideCount);
      }
    }

    function leaveVoice() {
      cleanupAudio();
      window.location.href = '/';
    }

    backBtn && backBtn.addEventListener('click', leaveVoice);

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.continuous = false;

      recognition.onstart = () => {
        setListening(true);
        setStatus('Listening...');
      };
      recognition.onerror = (event) => {
        console.error('speech error', event);
        setListening(false);
        const errCode = (event && event.error) || '';
        switch (errCode) {
          case 'no-speech':
            setStatus('No speech detected. Try again.');
            if (noteEl) noteEl.textContent = 'We could not hear anything. Speak closer to the microphone.';
            break;
          case 'audio-capture':
            setStatus('Microphone not found.');
            if (noteEl) noteEl.textContent = 'Attach a microphone or pick a different input in your browser settings.';
            break;
          case 'not-allowed':
          case 'service-not-allowed':
            setStatus('Microphone permission blocked.');
            if (noteEl) noteEl.textContent = 'Allow microphone access in your browser to keep using voice mode.';
            break;
          case 'aborted':
            setStatus('Listening cancelled. Tap the button to try again.');
            break;
          default:
            setStatus('Mic error. Check permissions and try again.');
            if (noteEl && !noteEl.textContent) {
              noteEl.textContent = 'If the issue persists, reload the page.';
            }
        }
      };
      recognition.onend = () => {
        setListening(false);
        if (!awaitingReply) {
          setStatus('Tap the button to speak');
        }
      };
      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const res = event.results[i];
          if (res.isFinal && res[0]) {
            transcript += res[0].transcript || '';
          }
        }
        transcript = transcript.trim();
        if (transcript) {
          sendToAgent(transcript);
        } else {
          setStatus('I did not catch that. Try again.');
        }
      };
      micBtn.addEventListener('click', async () => {
        if (!recognition) return;
        if (awaitingReply) {
          setStatus('Hold on, Lyra is still replying.');
          return;
        }
        try {
          if (!listening) {
            if (!introPrompted) {
              try {
                await sendToAgent('', { allowEmpty: true });
                introPrompted = true;
              } catch (err) {
                console.error('intro send error', err);
              }
            }
            recognition.start();
          } else {
            recognition.stop();
          }
        } catch (err) {
          console.error('recognition start error', err);
          setStatus('Unable to access the microphone.');
          if (noteEl) {
            noteEl.textContent = 'Check that microphone permissions are granted.';
          }
        }
      });
    } else {
      micBtn.disabled = true;
      micBtn.classList.add('is-disabled');
      if (noteEl) {
        noteEl.textContent = 'Voice recognition unavailable in this browser. Try Chrome on desktop.';
      }
      setStatus('Microphone unavailable');
    }

    window.addEventListener('beforeunload', () => {
      cleanupAudio();
      if (recognition && listening) {
        try { recognition.stop(); } catch (err) {}
      }
    });
  })();
  </script>
</body>
</html>
