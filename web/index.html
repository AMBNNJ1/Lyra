<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lyra - Chat</title>
  <link rel="icon" href="/lyra/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    let historyPoll = null;
    let lastSeenCount = 0;
    let lastSeenFp = "";
    let emoPoll = null;
    let clerkInstance = null;
    let authToken = null;
    let hasActivatedAuth = false;
    let clerkScriptPromise = null;
    let clerkSignInMounted = false;
    let clerkTokenTemplate = null;
    let clerkSignInUnmount = null;
    let clerkUserButtonUnmount = null;
    const CLERK_LOGIN_DISABLED = true; // temporary guest-only mode
    const DEFAULT_GUEST_LIMIT = 5;
    const GUEST_LIMIT = CLERK_LOGIN_DISABLED ? Number.MAX_SAFE_INTEGER : DEFAULT_GUEST_LIMIT;
    let guestId = null;
    let guestMessageCount = 0;
    (function initGuestQuota(){
      try {
        const storedId = localStorage.getItem('lyraGuestId');
        if (storedId) {
          guestId = storedId;
        } else {
          const generated = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2);
          guestId = generated;
          try { localStorage.setItem('lyraGuestId', guestId); } catch {}
        }
        const cachedCount = Number(localStorage.getItem('lyraGuestMessageCount') || '0');
        if (Number.isFinite(cachedCount) && cachedCount > 0) {
          guestMessageCount = Math.min(GUEST_LIMIT, cachedCount);
        } else {
          guestMessageCount = 0;
        }
      } catch {
        guestId = guestId || ((typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2));
        guestMessageCount = 0;
      }
    })();

    function canUseGuestQuota(){
      if (CLERK_LOGIN_DISABLED) return true;
      return !authToken && guestMessageCount < GUEST_LIMIT;
    }

    function ensureGuestIdentifier(){
      if (!guestId){
        guestId = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2);
        try { localStorage.setItem('lyraGuestId', guestId); } catch {}
      }
      return guestId;
    }

    function applyGuestHeaders(headers){
      const id = ensureGuestIdentifier();
      if (id) headers['X-Guest-Id'] = id;
    }

    function consumeGuestQuota(nextCount){
      if (CLERK_LOGIN_DISABLED) return;
      if (typeof nextCount === 'number' && Number.isFinite(nextCount)) {
        guestMessageCount = Math.max(guestMessageCount, nextCount);
      } else {
        guestMessageCount += 1;
      }
      if (guestMessageCount > GUEST_LIMIT) guestMessageCount = GUEST_LIMIT;
      try { localStorage.setItem('lyraGuestMessageCount', String(guestMessageCount)); } catch {}
      if (guestMessageCount >= GUEST_LIMIT && !authToken){
        const root = document.getElementById('clerkSignIn');
        if (root && (!clerkInstance || !clerkInstance.isSignedIn)){
          if (!clerkSignInMounted) {
            root.innerHTML = '<p class="error">Please sign in to keep chatting with Lyra.</p>';
          }
        }
        setTimeout(() => { if (!authToken && !CLERK_LOGIN_DISABLED) openClerkModal(); }, 50);
      }
    }

    function loadClerkScript(pk){
      if (window.Clerk) return Promise.resolve();
      if (clerkScriptPromise) return clerkScriptPromise;
      clerkScriptPromise = new Promise((resolve, reject) => {
        const existing = document.querySelector('script[data-clerk-js]');
        if (existing){
          const finalize = () => resolve();
          if (existing.getAttribute('data-clerk-publishable-key') === pk && existing.hasAttribute('data-loaded')){
            finalize();
            return;
          }
          existing.addEventListener('load', finalize, { once: true });
          existing.addEventListener('error', () => reject(new Error('Failed to load Clerk script')), { once: true });
          return;
        }
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
        s.async = true;
        s.crossOrigin = 'anonymous';
        s.setAttribute('data-clerk-js', 'true');
        s.setAttribute('data-clerk-publishable-key', pk);
        s.onload = () => {
          s.setAttribute('data-loaded', 'true');
          resolve();
        };
        s.onerror = () => reject(new Error('Failed to load Clerk script'));
        document.head.appendChild(s);
      });
      return clerkScriptPromise;
    }

    async function post(path, body){
      const headers = {'Content-Type':'application/json'};
      if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
      else applyGuestHeaders(headers);
      const r = await fetch(path, { method:'POST', headers, body: JSON.stringify(body||{}) });
      if(r.status === 401){
        if (!canUseGuestQuota() && !CLERK_LOGIN_DISABLED) openClerkModal();
        throw new Error('unauthorized');
      }
      if(!r.ok) throw new Error('request failed');
      return await r.json();
    }
    async function get(path){
      const headers = authToken ? { 'Authorization': `Bearer ${authToken}` } : {};
      if (!authToken) applyGuestHeaders(headers);
      const r = await fetch(path, { headers });
      if(r.status === 401){
        if (!canUseGuestQuota() && !CLERK_LOGIN_DISABLED) openClerkModal();
        throw new Error('unauthorized');
      }
      if(!r.ok) throw new Error('request failed');
      return await r.json();
    }
    function msgEl(role, text){
      const wrap = document.createElement('div');
      wrap.className = 'message ' + role;
      const av = document.createElement('div');
      av.className = 'avatar' + (role==='assistant' ? ' ai' : ' user');
      if (role === 'assistant') {
        const img = document.createElement('img');
        img.src = '/assets/nova_avatar.jpg';
        img.alt = 'Lyra avatar';
        av.appendChild(img);
      } else {
        av.textContent = 'You';
      }
      const content = document.createElement('div');
      content.className = 'content';
      content.textContent = text || '';
      wrap.appendChild(av); wrap.appendChild(content);
      return wrap;
    }
    function msgContentRef(el){ return el.querySelector('.content'); }
    function scrollToBottom(){
      const sc = document.getElementById('scroller');
      if(!sc) return;
      // Twice, to catch layout after images/fonts paint
      requestAnimationFrame(()=>{
        sc.scrollTop = sc.scrollHeight;
        requestAnimationFrame(()=>{ sc.scrollTop = sc.scrollHeight; });
      });
    }
    function autoResize(el){
      el.style.height = 'auto';
      const next = Math.min(220, Math.max(44, el.scrollHeight));
      el.style.height = next + 'px';
    }
    function openClerkModal(){
      if (CLERK_LOGIN_DISABLED) return;
      const modal = document.getElementById('authModal');
      if (!modal) return;
      const root = document.getElementById('clerkSignIn');
      if (!clerkInstance){
        if (root && !clerkSignInMounted){
          root.innerHTML = '<p class="error">Authentication service is still loading...</p>';
        }
        modal.hidden = false;
        return;
      }
      if (root){
        if (!clerkSignInMounted){
          try{
            if (typeof clerkInstance.unmountSignIn === 'function'){
              clerkInstance.unmountSignIn(root);
            } else if (typeof clerkSignInUnmount === 'function'){
              clerkSignInUnmount();
              clerkSignInUnmount = null;
            }
          }catch(e){}
          clerkSignInMounted = false;
          root.innerHTML = '';
          const redirectTarget = window.location.href.split('#')[0];
          const mountOptions = {
            appearance: { elements: { card: 'card' } },
            redirectUrl: redirectTarget,
            afterSignInUrl: redirectTarget,
            afterSignUpUrl: redirectTarget,
          };
          try{
            const mountResult = clerkInstance.mountSignIn(root, mountOptions);
            clerkSignInMounted = true;
            if (typeof mountResult === 'function'){
              clerkSignInUnmount = mountResult;
            } else {
              clerkSignInUnmount = null;
            }
            if (mountResult && typeof mountResult.then === 'function'){
              mountResult.catch((err) => {
                console.error('[clerk] mountSignIn failed', err);
                clerkSignInMounted = false;
                clerkSignInUnmount = null;
                root.innerHTML = '<p class="error">Unable to load sign in. Please try again.</p>';
              });
            }
          }catch(err){
            console.error('[clerk] mountSignIn failed', err);
            clerkSignInMounted = false;
            clerkSignInUnmount = null;
            root.innerHTML = '<p class="error">Unable to load sign in. Please try again.</p>';
          }
        }
      }
      modal.hidden = false;
    }

    async function initClerk(){
      if (CLERK_LOGIN_DISABLED) {
        const login = document.getElementById('loginBtn');
        const userBtn = document.getElementById('clerkUserButton');
        if (login) login.hidden = true;
        if (userBtn) userBtn.hidden = true;
        return;
      }
      try {
        const res = await fetch('/api/auth/config');
        if (!res.ok) throw new Error('config request failed');
        const data = await res.json();
        const pk = data.publishableKey;
        clerkTokenTemplate = (data.jwtTemplate && data.jwtTemplate.trim()) ? data.jwtTemplate.trim() : null;
        if (!pk){
          console.warn('[clerk] publishable key missing');
          const root = document.getElementById('clerkSignIn');
          if (root) root.innerHTML = '<p class="error">Clerk publishable key is not configured.</p>';
          return;
        }
        await loadClerkScript(pk);
        await new Promise((resolve) => {
          if (window.Clerk) return resolve();
          const check = () => { if (window.Clerk) resolve(); else setTimeout(check, 20); };
          check();
        });
        const clerk = window.Clerk;
        if (!clerk) {
          throw new Error('Clerk failed to initialize');
        }
        const alreadyLoaded = clerk.__lyraLoaded || (typeof clerk.isLoaded === 'function' ? clerk.isLoaded() : false);
        if (!alreadyLoaded) {
          await clerk.load({ publishableKey: pk });
          clerk.__lyraLoaded = true;
        }
        clerkInstance = clerk;
        handleClerkState();
        clerkInstance.addListener(handleClerkState);
      } catch (err) {
        console.error('[clerk] init failed', err);
        clerkSignInMounted = false;
        const root = document.getElementById('clerkSignIn');
        if (root) root.innerHTML = `<p class="error">Authentication service unavailable.</p>`;
      }
    }

    async function refreshAuthToken(){
      if (!clerkInstance || !clerkInstance.session) {
        authToken = null;
        return;
      }
      try {
        if (clerkTokenTemplate) {
          authToken = await clerkInstance.session.getToken({ template: clerkTokenTemplate });
        } else {
          authToken = await clerkInstance.session.getToken();
        }
      } catch (err) {
        console.warn('[clerk] token fetch failed', err);
        if (clerkTokenTemplate) {
          try {
            authToken = await clerkInstance.session.getToken();
            console.warn('[clerk] falling back to session token without template');
          } catch (fallbackErr) {
            console.warn('[clerk] fallback token fetch failed', fallbackErr);
            authToken = null;
          }
        } else {
          authToken = null;
        }
      }
    }

    async function handleClerkState(){
      const loginBtn = document.getElementById('loginBtn');
      const userContainer = document.getElementById('clerkUserButton');
      const modal = document.getElementById('authModal');
      const signInRoot = document.getElementById('clerkSignIn');
      if (!clerkInstance){
        if (loginBtn) loginBtn.hidden = false;
        if (userContainer){
          userContainer.hidden = true;
          try{
            if (typeof clerkUserButtonUnmount === 'function'){
              clerkUserButtonUnmount();
            }
          }catch(e){}
          clerkUserButtonUnmount = null;
          userContainer.innerHTML = '';
        }
        return;
      }
      if (clerkInstance.isSignedIn){
        await refreshAuthToken();
        if (loginBtn) loginBtn.hidden = true;
        if (userContainer){
          userContainer.hidden = false;
          try{
            if (typeof clerkInstance.unmountUserButton === 'function'){
              clerkInstance.unmountUserButton(userContainer);
            } else if (typeof clerkUserButtonUnmount === 'function'){
              clerkUserButtonUnmount();
            }
          }catch(e){}
          clerkUserButtonUnmount = null;
          userContainer.innerHTML = '';
          const mountResult = clerkInstance.mountUserButton(userContainer, { appearance: { elements: { rootBox: 'user-button' } } });
          if (typeof mountResult === 'function'){
            clerkUserButtonUnmount = mountResult;
          }
        }
        if (modal) modal.hidden = true;
        if (!hasActivatedAuth && authToken){
          activateAuthenticatedFlows();
        }
      } else {
        authToken = null;
        hasActivatedAuth = false;
        if (userContainer){
          try{
            if (typeof clerkInstance.unmountUserButton === 'function'){
              clerkInstance.unmountUserButton(userContainer);
            } else if (typeof clerkUserButtonUnmount === 'function'){
              clerkUserButtonUnmount();
            }
          }catch(e){}
          clerkUserButtonUnmount = null;
          userContainer.hidden = true;
          userContainer.innerHTML = '';
        }
        if (loginBtn) loginBtn.hidden = false;
        if (modal) modal.hidden = true;
        if (historyPoll){ clearInterval(historyPoll); historyPoll = null; }
        if (emoPoll){ clearInterval(emoPoll); emoPoll = null; }
        if (signInRoot){
          try{
            if (typeof clerkInstance.unmountSignIn === 'function'){
              clerkInstance.unmountSignIn(signInRoot);
            } else if (typeof clerkSignInUnmount === 'function'){
              clerkSignInUnmount();
            }
          }catch(e){}
          clerkSignInUnmount = null;
          clerkSignInMounted = false;
          signInRoot.innerHTML = '';
        }
      }
    }

    function activateAuthenticatedFlows(){
      hasActivatedAuth = true;
      if (!emoPoll){
        fetchEmotion();
        emoPoll = setInterval(fetchEmotion, 1500);
      }
    }

    function startTalking(){
      const vid = document.getElementById('avatarVideo');
      if (!vid) return;
      vid.removeAttribute('data-state');
      vid.loop = true;
      if (!vid.currentSrc.includes('nova_video.mp4')) {
        vid.src = '/assets/nova_video.mp4';
        vid.load();
      }
      try { vid.play().catch(() => {}); } catch {}
    }
    function stopTalking(){
      const vid = document.getElementById('avatarVideo');
      if (!vid) return;
      vid.removeAttribute('data-state');
      vid.loop = true;
      if (!vid.currentSrc.includes('nova_video.mp4')) {
        vid.src = '/assets/nova_video.mp4';
        vid.load();
      }
      try { vid.play().catch(() => {}); } catch {}
    }

    async function fetchEmotion(){
      if (!authToken) return;
      try{
        const headers = authToken ? { 'Authorization': `Bearer ${authToken}` } : {};
        const r = await fetch('/api/emotion', { headers });
        if(!r.ok) return;
        const d = await r.json();
        updateEmotionUI(d);
      }catch{}
    }
    async function send(){
      const guestAllowed = canUseGuestQuota();
      if (!authToken && !guestAllowed && !CLERK_LOGIN_DISABLED) { openClerkModal(); return; }
      const ta = document.getElementById('ta');
      const sendBtn = document.getElementById('send');
      const txt = ta.value.trim();
      if(!txt) return;
      ta.value=''; autoResize(ta);
      const chat = document.getElementById('chat');
      // Show only the latest user message - clear previous ones
      chat.innerHTML = '';
      const userMsg = msgEl('user', txt);
      const aiMsg = msgEl('assistant', '');
      chat.appendChild(userMsg);
      const aiContent = msgContentRef(aiMsg);
      if (aiContent) aiContent.textContent = '...';
      chat.appendChild(aiMsg);
      scrollToBottom();
      sendBtn.disabled = true;
      let speech = '';
      const usedGuest = !authToken && guestAllowed;
      let guestShouldConsume = false;
      let guestOverrideCount = null;
      // Streaming via SSE over fetch body
      try{
        const headers = {'Content-Type':'application/json'};
        if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
        else if (usedGuest) applyGuestHeaders(headers);
        const res = await fetch('/api/chat/stream', { method:'POST', headers, body: JSON.stringify({message: txt}) });
        if(res.status===401){
          if (!CLERK_LOGIN_DISABLED) {
            openClerkModal();
            throw new Error('Sign in to continue');
          }
          throw new Error('unauthorized');
        }
        if (usedGuest) {
          guestShouldConsume = true;
          const remainingHeader = res.headers.get('X-Guest-Remaining');
          if (remainingHeader !== null) {
            const remainingNum = Number(remainingHeader);
            if (!Number.isNaN(remainingNum)) {
              const usedCount = Math.min(GUEST_LIMIT, Math.max(0, Math.round(GUEST_LIMIT - remainingNum)));
              guestOverrideCount = usedCount;
            }
          }
        }
        if(!res.ok){ throw new Error('request failed'); }
        if(!res.body){ throw new Error('request failed'); }
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        speech = '';
        startTalking();
        while(true){
          const {value, done} = await reader.read();
          if(done) break;
          buf += dec.decode(value, {stream:true});
          let idx;
          while((idx = buf.indexOf('\n\n')) !== -1){
            const chunk = buf.slice(0, idx); buf = buf.slice(idx+2);
            const line = chunk.split('\n').find(l=>l.startsWith('data:')) || '';
            const data = line.slice(5).trim();
            if(!data) continue;
            if(data === '[DONE]') { break; }
            try{
              // YAML one-line or JSON; try JSON first
              const obj = JSON.parse(data);
              const delta = obj.delta || '';
              if(delta){ speech += delta; if (aiContent) aiContent.textContent = speech; }
            }catch{
              // try to extract after "delta: " pattern
              const m = data.match(/delta:\s*(.*)$/);
              if(m && m[1]){ speech += m[1]; if (aiContent) aiContent.textContent = speech; }
            }
            scrollToBottom();
          }
        }
      }catch(e){
        const err = '(error) ' + (e?.message||'request failed');
        if (aiContent) aiContent.textContent = err;
      } finally {
        stopTalking();
        if (aiContent) {
          const finalText = speech.trim();
          aiContent.textContent = finalText ? finalText : aiContent.textContent || '...';
        }
        if (usedGuest && guestShouldConsume) consumeGuestQuota(guestOverrideCount);
      }
      sendBtn.disabled = false; scrollToBottom();
    }

    async function toggleContinuous(cb){
      if (!authToken && !CLERK_LOGIN_DISABLED) { cb.checked = false; openClerkModal(); return; }
      const on = cb.checked;
      try{ await post('/api/continuous', { enable: on }); }catch{}
      // Start/stop backend history polling to surface proactive messages
      if (on){
        if (historyPoll) clearInterval(historyPoll);
        // Prime lastSeenCount to current count to avoid replaying existing history
        try{
          const r0 = await fetch('/api/history');
          if (r0.ok){
            const d0 = await r0.json();
            const msgs0 = d0.messages || [];
            lastSeenCount = d0.count || msgs0.length || 0;
            const last0 = msgs0[lastSeenCount-1] || null;
            lastSeenFp = last0 ? `${last0.role}|${(last0.content||'').slice(-128)}` : "";
          }
        }catch{}
        historyPoll = setInterval(async ()=>{
          try{
            const headers = authToken ? { 'Authorization': `Bearer ${authToken}` } : {};
            const r = await fetch('/api/history', { headers });
            if(!r.ok) return;
            const data = await r.json();
            const msgs = data.messages || [];
            const n = data.count || msgs.length || 0;
            const last = msgs[n-1] || null;
            const fp = last ? `${last.role}|${(last.content||'').slice(-128)}` : "";
            // Detect either growth in count OR change in last fingerprint (covers truncated windows)
            if ((n > lastSeenCount) || (fp && fp !== lastSeenFp)){
              lastSeenCount = n;
              lastSeenFp = fp;
            }
          }catch{}
        }, 1500);
      }else{
        if (historyPoll){ clearInterval(historyPoll); historyPoll = null; }
      }
    }
    function applySavedTheme(){
      const t = localStorage.getItem('theme') || 'dark';
      document.body.classList.toggle('light', t==='light');
    }
    function toggleTheme(){
      const light = !document.body.classList.contains('light');
      document.body.classList.toggle('light', light);
      localStorage.setItem('theme', light ? 'light' : 'dark');
    }
    window.addEventListener('DOMContentLoaded', async ()=>{
      applySavedTheme();
      if (!CLERK_LOGIN_DISABLED){
        await initClerk();
      } else {
        const login = document.getElementById('loginBtn');
        const userBtn = document.getElementById('clerkUserButton');
        if (login) login.hidden = true;
        if (userBtn) userBtn.hidden = true;
      }
      // Ensure avatar video loops and autoplays; recover by reloading if playback fails
      const vid = document.getElementById('avatarVideo');
      if (vid) {
        try {
          vid.muted = true; vid.loop = true;
          const start = () => { vid.play().catch(()=>{}); };
          vid.addEventListener('canplay', start, { once: true });
          vid.addEventListener('loadeddata', start, { once: true });
          vid.addEventListener('error', () => {
            vid.removeAttribute('data-state');
            vid.loop = true;
            vid.src = '/assets/nova_video.mp4';
            vid.play().catch(()=>{});
          });
          if (vid.readyState >= 2) start();
        } catch {}
      }
      const ta = document.getElementById('ta');
      ta.addEventListener('input', ()=> autoResize(ta));
      ta.addEventListener('keydown', (e)=>{
        if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
      });
      document.getElementById('send').addEventListener('click', send);
      const voiceBtn = document.getElementById('voiceMode');
      voiceBtn?.addEventListener('click', ()=>{ window.location.href = '/voice'; });
      document.getElementById('theme').addEventListener('click', toggleTheme);
      const loginBtn = document.getElementById('loginBtn');
      if (loginBtn){
        if (CLERK_LOGIN_DISABLED) {
          loginBtn.hidden = true;
        } else {
          loginBtn.addEventListener('click', () => { openClerkModal(); });
        }
      }
      const authClose = document.getElementById('authClose');
      authClose?.addEventListener('click', () => { const m = document.getElementById('authModal'); if (m) m.hidden = true; });
      // Auto-scroll whenever chat content changes (including streaming)
      const chat = document.getElementById('chat');
      const mo = new MutationObserver(() => scrollToBottom());
      mo.observe(chat, { childList: true, subtree: true, characterData: true });
      window.addEventListener('resize', scrollToBottom);
      scrollToBottom();

      // Micro-gestures removed
    });
  </script>

  <meta name="theme-color" content="#343541" />

  <link rel="preconnect" href="https://fonts.googleapis.com">

  </head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="topbar-actions">
        <button id="loginBtn" class="theme-btn" aria-label="Sign in">Sign in</button>
        <div id="clerkUserButton" class="user-button" hidden></div>
        <button id="voiceMode" class="theme-btn icon-only" aria-label="Open voice mode"><span aria-hidden="true">&#127908;</span></button>
        <button id="theme" class="theme-btn icon-only" aria-label="Toggle theme"><span aria-hidden="true">&#9728;</span></button>
      </div>
    </div>
    <div class="main" style="display: flex; flex-direction: column;">
      <div style="display: flex; justify-content: center; padding: 20px 0; flex-shrink: 0;">
        <aside class="avatar-pane">
          <div class="unity-wrap">
            <div id="avatarFrame" class="avatar-frame">
              <video id="avatarVideo" class="avatar-video" src="/assets/nova_video.mp4" autoplay muted loop playsinline preload="auto" aria-label="Avatar video"></video>
            </div>
            <div id="emotionCard" class="emotion-card" aria-live="polite">
              <div class="em-head">
                <span id="emEmoji" class="em-emoji">😐</span>
                <span id="emName" class="em-name">neutral</span>
                <span id="emStrength" class="em-strength">0%</span>
              </div>
              <div class="em-meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="emFill" class="em-fill"></div>
              </div>
              <div id="emTags" class="em-tags"></div>
            </div>
          </div>
        </aside>
      </div>
      <section class="chat-pane" style="flex: 1; width: 100%; max-width: 800px; margin: 0 auto;">
        <div id="scroller" class="chat-scroll">
          <div id="chat" class="chat">
            <!-- Messages will appear here -->
          </div>
        </div>
